name: Build Windows

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - uses: actions/upload-artifact@v4
        with:
          name: siv_front-windows
          path: build/windows/x64/runner/Release/

      # Pacote MSIX pronto pra Microsoft Store (usa o `msix_config` do pubspec: ícones/tiles do SIV, versão, idiomas).
      # O build do Windows já foi feito acima (com o SENTRY_DSN), então não refaz.
      # A Store recusa versão repetida: a versão vem do nº da execução (1.1.<run>.0, sempre crescente; o último número é 0
      # por regra da Store). Substitui o msix_version do pubspec, que fica só como valor local.
      - name: Gera o pacote MSIX da Microsoft Store
        run: dart run msix:create --store --build-windows false --version 1.1.${{ github.run_number }}.0

      - uses: actions/upload-artifact@v4
        with:
          name: siv_front-msix
          path: build/windows/x64/runner/Release/*.msix
          if-no-files-found: error
