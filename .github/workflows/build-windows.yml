name: Build Windows

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - run: flutter pub get

      # A Microsoft Store recusa versão repetida E versão menor que a já publicada. A versão vem do nº da
      # execução deste workflow (github.run_number), que só cresce -- enquanto o arquivo
      # build-windows.yml NÃO for renomeado/recriado (o contador recomeçaria em 1) e a fórmula não mudar.
      # PISO = maior nº de execução já gerado (67, versão 1.1.67.0). Se a execução cair abaixo dele,
      # o build para ANTES de gerar um pacote que a Store recusaria ou que seria "menor que a atual".
      - name: Garante que a versão do pacote é maior que a já publicada
        shell: bash
        run: |
          PISO=67
          RUN=${{ github.run_number }}
          echo "Versão deste build: 1.1.$RUN.0 (piso: 1.1.$PISO.0)"
          if [ "$RUN" -le "$PISO" ]; then
            echo "ERRO: nº da execução ($RUN) <= piso ($PISO). O workflow foi recriado/renomeado? A versão ficaria menor ou igual à já publicada na Store."
            exit 1
          fi

      # --build-name/--build-number: o executável (e o package_info_plus, que mostra a versão na barra do app)
      # passa a ter a MESMA versão do pacote da Store (1.1.<run>.0), em vez do 1.0.0+1 do pubspec.
      - run: flutter build windows --release --build-name=1.1.${{ github.run_number }} --build-number=0 --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - uses: actions/upload-artifact@v4
        with:
          name: siv_front-windows
          path: build/windows/x64/runner/Release/

      # Pacote MSIX pronto pra Microsoft Store (usa o `msix_config` do pubspec: ícones/tiles do SIV, versão, idiomas).
      # O build do Windows já foi feito acima (com o SENTRY_DSN), então não refaz.
      # A Store recusa versão repetida: a versão vem do nº da execução (1.1.<run>.0, sempre crescente; o último número é 0
      # por regra da Store). Substitui o msix_version do pubspec, que fica só como valor local.
      - name: Gera o pacote MSIX da Microsoft Store
        run: dart run msix:create --store --build-windows false --version 1.1.${{ github.run_number }}.0

      - uses: actions/upload-artifact@v4
        with:
          name: siv_front-msix
          path: build/windows/x64/runner/Release/*.msix
          if-no-files-found: error
